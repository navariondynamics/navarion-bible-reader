<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />

  <meta name="theme-color" content="#111111" />

  <link
    rel="manifest"
    href="./manifest.json"
  />

  <link
    rel="apple-touch-icon"
    href="./icons/icon-192.png"
  />

  <link
    rel="stylesheet"
    href="./styles.css"
  />

  <title>Bible Reader</title>
</head>

<body>

  <header class="topbar">

    <div>
      <h1 id="appTitle">Bible Reader</h1>
      <p id="translationLabel"></p>
    </div>

    <button
      id="installHelp"
      class="ghost"
    >
      Install
    </button>

  </header>


  <main>

    <section class="card controls">

      <label id="languageLabel">
        Language

        <select id="languageSelect">

          <option value="en">
            English
          </option>

          <option value="es">
            Español
          </option>

        </select>
      </label>


      <label id="translationSelectLabel">
        Translation

        <select id="translationSelect">
        </select>
      </label>


      <label id="bookLabel">
        Book

        <select id="bookSelect">
        </select>
      </label>


      <label id="chapterLabel">
        Chapter

        <select id="chapterSelect">
        </select>
      </label>


      <label id="verseLabel">
        Start verse

        <select id="verseSelect">
        </select>
      </label>


      <label id="voiceLabel">
        Voice

        <select id="voiceSelect">
        </select>
      </label>


      <div class="buttonRow">

        <button id="prevBtn">
          ◀ Previous
        </button>

        <button id="nextBtn">
          Next ▶
        </button>

      </div>


      <div class="buttonRow">

        <button
          id="playBtn"
          class="primary"
        >
          ▶ Play from here
        </button>

        <button id="pauseBtn">
          ⏸ Pause
        </button>

        <button id="stopBtn">
          ■ Stop
        </button>

      </div>


      <label id="speedLabel">

  Speed

  <select id="rateSelect">

    <option value="0.75">
      0.75×
    </option>

    <option value="1" selected>
      1.0×
    </option>

    <option value="1.25">
      1.25×
    </option>

    <option value="1.5">
      1.5×
    </option>

    <option value="1.75">
      1.75×
    </option>

    <option value="2">
      2.0×
    </option>

  </select>

</label>

    </section>


    <section class="card">

      <div class="chapterTitleRow">

        <h2 id="chapterTitle">
        </h2>

        <button
          id="resumeBtn"
          class="ghost"
        >
          Resume saved place
        </button>

      </div>

      <div
        id="verses"
        class="verses"
      >
      </div>

    </section>


    <section
      id="installNote"
      class="card note"
    >

      <strong>
        iPhone install:
      </strong>

      Open this site in Safari →
      Share →
      Add to Home Screen →
      Open as Web App.

    </section>

  </main>


  <script src="./app.js"></script>

</body>
</html>
